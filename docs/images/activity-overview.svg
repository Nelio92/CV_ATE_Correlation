<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">CV ATE Correlation Activity Overview</title>
  <desc id="desc">Overview graphic showing extraction, DPLL delta correlation, linear TX correlation, and model-based Kf correlation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f3ed"/>
      <stop offset="100%" stop-color="#eee5da"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d7a84"/>
      <stop offset="100%" stop-color="#5b9aa2"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b77a43"/>
      <stop offset="100%" stop-color="#d49f63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6d5e4b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8d7e6c"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="464" rx="26" fill="#fffdfa" stroke="#d9cec2"/>

  <text x="70" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#24313a">CV ↔ ATE Correlation Activity</text>
  <text x="70" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#5f6b74">Transferred workflow for CTRX8188 extraction, DPLL delta correlation, TXLO/TXPA offset correlation, and Kf-assisted modeling.</text>

  <line x1="240" y1="310" x2="335" y2="310" stroke="#8d7e6c" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="520" y1="310" x2="615" y2="310" stroke="#8d7e6c" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="800" y1="310" x2="895" y2="310" stroke="#8d7e6c" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="186" width="170" height="220" rx="24" fill="#ffffff" stroke="#ddd2c6"/>
    <rect x="102" y="214" width="106" height="82" rx="14" fill="#eef3f4" stroke="#cfd9dc"/>
    <path d="M118 236h74M118 255h74M118 274h54" stroke="#2d7a84" stroke-width="5" stroke-linecap="round"/>
    <circle cx="196" cy="272" r="10" fill="#b77a43"/>
    <text x="155" y="334" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#24313a">Extraction</text>
    <text x="155" y="364" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5f6b74">raw CSV / XLSX</text>
    <text x="155" y="387" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5f6b74">chip + test filters</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="186" width="170" height="220" rx="24" fill="#ffffff" stroke="#ddd2c6"/>
    <rect x="382" y="214" width="106" height="82" rx="14" fill="#eef3f4" stroke="#cfd9dc"/>
    <path d="M392 276 L412 252 L432 268 L452 240 L478 228" fill="none" stroke="#2d7a84" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M392 286 L478 286" stroke="#b77a43" stroke-width="4" stroke-dasharray="8 6"/>
    <text x="435" y="334" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#24313a">DPLL Delta</text>
    <text x="435" y="364" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5f6b74">avg delta + WC GB</text>
    <text x="435" y="387" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5f6b74">updated ATE limits</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="186" width="170" height="220" rx="24" fill="#ffffff" stroke="#ddd2c6"/>
    <rect x="662" y="214" width="106" height="82" rx="14" fill="#eef3f4" stroke="#cfd9dc"/>
    <line x1="680" y1="282" x2="744" y2="226" stroke="#2d7a84" stroke-width="5"/>
    <circle cx="690" cy="272" r="6" fill="#b77a43"/>
    <circle cx="710" cy="258" r="6" fill="#b77a43"/>
    <circle cx="732" cy="242" r="6" fill="#b77a43"/>
    <text x="715" y="334" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#24313a">Linear TX</text>
    <text x="715" y="364" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5f6b74">median delta model</text>
    <text x="715" y="387" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5f6b74">TXLO / TXPA groups</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="186" width="170" height="220" rx="24" fill="#ffffff" stroke="#ddd2c6"/>
    <rect x="942" y="214" width="106" height="82" rx="14" fill="#eef3f4" stroke="#cfd9dc"/>
    <path d="M958 278 C980 250, 998 244, 1028 222" fill="none" stroke="#2d7a84" stroke-width="5" stroke-linecap="round"/>
    <path d="M958 248 C980 264, 1000 270, 1028 286" fill="none" stroke="#b77a43" stroke-width="4" stroke-dasharray="9 6" stroke-linecap="round"/>
    <text x="995" y="334" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#24313a">ModelX</text>
    <text x="995" y="364" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5f6b74">offset + Kf model</text>
    <text x="995" y="387" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5f6b74">fit and residual review</text>
  </g>
</svg>
