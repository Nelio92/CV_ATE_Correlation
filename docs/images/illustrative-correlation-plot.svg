<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative CV ATE correlation plot</title>
  <desc id="desc">Illustrative dual-panel graphic showing a CV versus ATE correlation scatter and a limit adaptation view. This is not real data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf7f2"/>
      <stop offset="100%" stop-color="#efe5d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d5e4b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#24313a">Illustrative Correlation Views</text>
  <text x="70" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5f6b74">Schematic documentation image only. It represents the kind of plots produced by the scripts, not measured project data.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="500" height="340" rx="24" fill="#ffffff" stroke="#ddd2c6"/>
    <text x="90" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#24313a">CV vs ATE Scatter</text>
    <line x1="110" y1="430" x2="500" y2="430" stroke="#a99783" stroke-width="3"/>
    <line x1="110" y1="430" x2="110" y2="220" stroke="#a99783" stroke-width="3"/>
    <text x="280" y="468" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5f6b74">ATE</text>
    <text x="54" y="335" transform="rotate(-90 54 335)" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5f6b74">CV</text>
    <line x1="128" y1="410" x2="484" y2="238" stroke="#b77a43" stroke-width="5" stroke-dasharray="10 8"/>
    <line x1="128" y1="388" x2="484" y2="216" stroke="#2d7a84" stroke-width="6"/>
    <circle cx="160" cy="376" r="8" fill="#2d7a84"/>
    <circle cx="198" cy="356" r="8" fill="#2d7a84"/>
    <circle cx="224" cy="340" r="8" fill="#2d7a84"/>
    <circle cx="262" cy="320" r="8" fill="#2d7a84"/>
    <circle cx="298" cy="300" r="8" fill="#2d7a84"/>
    <circle cx="330" cy="284" r="8" fill="#2d7a84"/>
    <circle cx="370" cy="266" r="8" fill="#2d7a84"/>
    <circle cx="408" cy="248" r="8" fill="#2d7a84"/>
    <circle cx="446" cy="230" r="8" fill="#2d7a84"/>
    <text x="382" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#b77a43">raw trend</text>
    <text x="360" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2d7a84">correlated trend</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="150" width="500" height="340" rx="24" fill="#ffffff" stroke="#ddd2c6"/>
    <text x="670" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#24313a">Limit Adaptation View</text>
    <line x1="690" y1="430" x2="1080" y2="430" stroke="#a99783" stroke-width="3"/>
    <line x1="690" y1="430" x2="690" y2="220" stroke="#a99783" stroke-width="3"/>
    <text x="886" y="468" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5f6b74">Grouped DUT samples</text>
    <text x="634" y="335" transform="rotate(-90 634 335)" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5f6b74">Value</text>
    <polyline points="716,352 756,342 796,336 836,328 876,320 916,315 956,306 996,300 1036,294" fill="none" stroke="#2d7a84" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="706" y1="252" x2="1050" y2="252" stroke="#5f6b74" stroke-width="4" stroke-dasharray="10 8"/>
    <line x1="706" y1="272" x2="1050" y2="272" stroke="#2d7a84" stroke-width="5"/>
    <line x1="706" y1="294" x2="1050" y2="294" stroke="#b77a43" stroke-width="5" stroke-dasharray="10 8"/>
    <text x="1062" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5f6b74">old limit</text>
    <text x="1062" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2d7a84">new limit</text>
    <text x="1062" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#b77a43">WC limit</text>
  </g>
</svg>