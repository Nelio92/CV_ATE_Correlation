<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">CorreLaTE Convergence</title>
  <desc id="desc">Two measured data streams converge into one correlated signal.</desc>
  <defs>
    <linearGradient id="blue" x1="12" y1="28" x2="110" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173F73"/><stop offset="1" stop-color="#38A6E8"/>
    </linearGradient>
    <linearGradient id="green" x1="18" y1="103" x2="111" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B6B45"/><stop offset="1" stop-color="#55C78A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#10243D" flood-opacity=".24"/>
    </filter>
  </defs>
  <path d="M17 26C42 23 47 45 66 49c17 4 22 7 43 15" fill="none" stroke="url(#blue)" stroke-width="10" stroke-linecap="round"/>
  <path d="M17 102c25 3 32-25 50-29 18-4 23-6 42-9" fill="none" stroke="url(#green)" stroke-width="10" stroke-linecap="round"/>
  <g fill="#fff" stroke-width="4">
    <circle cx="20" cy="26" r="7" stroke="#1D568A"/><circle cx="47" cy="39" r="6" stroke="#2D7FB4"/>
    <circle cx="20" cy="102" r="7" stroke="#20754D"/><circle cx="48" cy="89" r="6" stroke="#3CA66E"/>
  </g>
  <circle cx="78" cy="64" r="20" fill="#fff" stroke="#F2B544" stroke-width="6" filter="url(#shadow)"/>
  <path d="M70 64l6 6 12-14" fill="none" stroke="#173F73" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M96 64h17" stroke="#F2B544" stroke-width="8" stroke-linecap="round"/>
</svg>
