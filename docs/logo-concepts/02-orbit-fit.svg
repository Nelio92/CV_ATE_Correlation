<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">CorreLaTE Orbit Fit</title>
  <desc id="desc">Lab and ATE observations orbit a precise fitted diagonal.</desc>
  <defs>
    <linearGradient id="ring" x1="20" y1="108" x2="110" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173F73"/><stop offset=".52" stop-color="#26A69A"/><stop offset="1" stop-color="#67C587"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" stroke-dasharray="210 92" transform="rotate(-23 64 64)"/>
  <path d="M26 96L102 30" stroke="#F2B544" stroke-width="8" stroke-linecap="round"/>
  <path d="M27 83L86 32" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
  <g stroke="#fff" stroke-width="3">
    <circle cx="33" cy="91" r="7" fill="#173F73"/><circle cx="48" cy="78" r="6" fill="#2476A5"/>
    <circle cx="62" cy="67" r="6" fill="#269B9A"/><circle cx="77" cy="53" r="6" fill="#43B57F"/>
    <circle cx="95" cy="35" r="7" fill="#67C587"/>
  </g>
  <circle cx="64" cy="64" r="9" fill="#F2B544" stroke="#fff" stroke-width="4" filter="url(#glow)"/>
</svg>
