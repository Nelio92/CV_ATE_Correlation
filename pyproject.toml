[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-ate-correlation"
version = "0.1.0"
description = "Profile-driven ATE-to-reference measurement correlation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Wandji Lionel Wilfried (ES RF D RAD PTE TE4)" },
]
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cv-ate-correlation = "cv_ate_correlation.cli:main"

[project.gui-scripts]
correlate = "cv_ate_correlation.exe_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cv_ate_correlation = ["assets/*.png", "assets/*.svg", "assets/*.ico", "assets/*.xlsx"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "slow: reads the complete 8188 raw-data campaign",
]
